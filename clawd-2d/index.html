<!doctype html><meta charset=utf-8><title>Clawd</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:sans-serif;background:linear-gradient(#5aa9e6 0%,#bfe3f5 55%,#1d5f8a 55%,#0b3a5c 100%)}
svg.scene{position:absolute;inset:0;width:100%;height:100%}
.ship{animation:bob 4s ease-in-out infinite;transform-origin:500px 520px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(14px) rotate(2deg)}}
.wave{animation:wv 6s linear infinite}.w2{animation-duration:9s;animation-direction:reverse}
@keyframes wv{to{transform:translateX(-200px)}}
.flag{animation:fl 1s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes fl{to{transform:skewY(8deg) scaleX(.9)}}
.cloud{animation:cl 60s linear infinite}@keyframes cl{from{transform:translateX(-300px)}to{transform:translateX(1300px)}}
.txt{position:absolute;top:18px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 3px 8px #000a}
h2{margin:0;font-size:40px;color:#ffe08a}
.jb{box-sizing:border-box;position:relative;background:#fff;color:#1b1b1b;font:bold 27px/1.25 sans-serif;padding:16px 24px;border-radius:28px;width:640px;min-height:80px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 6px 0 #0003}
.jb:after{content:'';position:absolute;left:320px;bottom:-30px;border:22px solid transparent;border-top:32px solid #fff;border-bottom:0}
.isl{animation:drift linear infinite;transform:translateX(-400px)}
@keyframes drift{0%{transform:translateX(-400px)}100%{transform:translateX(1400px)}}
</style>

<div class=txt><h2>Arrr! Kinder, esst schneller, ihr Landratten!</h2></div>
<script>
const m=["Was sagt ein Keks beim Arzt? – Ich fühle mich krümelig!","Warum können Geister so schlecht lügen? – Man sieht sofort durch sie hindurch!","Was ist grün und klopft an die Tür? – Ein Klopfsalat!","Treffen sich zwei Magnete. Sagt der eine: Was soll ich heute anziehen?","Was macht ein Pirat am Computer? – Er drückt die Enter-Taste!","Warum nehmen Fische kein Handy? – Weil sie Angst vorm Netz haben!","Was ist der Lieblingssport von Kühen? – Muh-Tainbike!","Wie nennt man einen Bumerang, der nicht zurückkommt? – Stock!","Was sagt die große Tomate zur kleinen? – Komm, Ketchup!","Warum ist das Mathebuch traurig? – Es hat so viele Probleme!","Was ist gelb und schießt um die Ecke? – Eine Bananenkanone!","Was sagt der Teddy, wenn er nichts mehr essen kann? – Danke, ich bin schon gestopft!"];
let k=-1;function nx(){t.textContent=m[++k%m.length]}nx();setInterval(nx,8000);

const an=['pirate','dancing','waving','laughing','eating','flexing','cool','surprised','celebrating','coffee','fishing','telescope'];
an.forEach(n=>{new Image().src='../assets/clawd-'+n+'.svg'});
let ai=0;setInterval(()=>{ai=(ai+1)%an.length;cl.setAttribute('href','../assets/clawd-'+an[ai]+'.svg')},10000);
</script>
