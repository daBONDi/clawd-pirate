<script type=module>
import * as THREE from '../assets/three.module.js';
try{
// ============ setup
const W=()=>innerWidth,H=()=>innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(1);renderer.setSize(W(),H());document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fd0f0);
const VIEW=18;
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-200,400);
function fit(){const a=W()/H();cam.left=-VIEW*a/2;cam.right=VIEW*a/2;cam.top=VIEW/2;cam.bottom=-VIEW/2;cam.updateProjectionMatrix();renderer.setSize(W(),H())}
fit();addEventListener('resize',fit);
const CAMOFF=new THREE.Vector3(40,40,40);
const hemi=new THREE.HemisphereLight(0xffffff,0x5a8aaa,1.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d0,1.25);sun.position.set(-20,40,10);scene.add(sun);
const SUNDIR=sun.position.clone().normalize();
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const rnd=(a,b)=>a+Math.random()*(b-a);
const norm=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const lerp=(a,b,f)=>a+(b-a)*f;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const C=c=>new THREE.Color(c);

// ============ geometry baker: many colored parts -> one mesh (one draw call)
const vcMat=new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true});
class Baker{
  constructor(){this.pos=[];this.col=[]}
  add(geo,color,p=[0,0,0],r=[0,0,0],s=[1,1,1]){
    const m=new THREE.Matrix4().compose(V(...p),new THREE.Quaternion().setFromEuler(new THREE.Euler(...r)),V(...s));
    return this.addM(geo,color,m);
  }
  addM(geo,color,m){
    const g=geo.index?geo.toNonIndexed():geo;g.applyMatrix4(m);
    const a=g.attributes.position.array;this.pos.push(a);
    const c=C(color),n=a.length/3,ca=new Float32Array(n*3);
    for(let i=0;i<n;i++){ca[i*3]=c.r;ca[i*3+1]=c.g;ca[i*3+2]=c.b}
    this.col.push(ca);if(g!==geo)geo.dispose();return this;
  }
  rope(a,b,r,color,seg=4){
    const d=new THREE.Vector3().subVectors(b,a),len=d.length();
    const m=new THREE.Matrix4().compose(a.clone().add(b).multiplyScalar(.5),new THREE.Quaternion().setFromUnitVectors(V(0,1,0),d.normalize()),V(1,1,1));
    return this.addM(new THREE.CylinderGeometry(r,r,len,seg),color,m);
  }
  build(mat=vcMat){
    const cat=arrs=>{const n=arrs.reduce((s,a)=>s+a.length,0),o=new Float32Array(n);let k=0;for(const a of arrs){o.set(a,k);k+=a.length}return o};
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(cat(this.pos),3));
    geo.setAttribute('color',new THREE.BufferAttribute(cat(this.col),3));
    geo.computeVertexNormals();return new THREE.Mesh(geo,mat);
  }
}
const Box=(x,y,z)=>new THREE.BoxGeometry(x,y,z),Cyl=(a,b,h,n=8)=>new THREE.CylinderGeometry(a,b,h,n),Sph=(r,a=6,b=5)=>new THREE.SphereGeometry(r,a,b),Cone=(r,h,n=6)=>new THREE.ConeGeometry(r,h,n);

// ============ sea (GPU waves; same function in JS for buoyancy)
function waveY(x,z,t){return Math.sin(x*.45+t*1.1)*.16+Math.cos(z*.38+t*1.4)*.16+Math.sin((x+z)*.2+t*.7)*.2+Math.sin(x*1.3-z*.7-t*2)*.04}
const seaUni={t:{value:0},cDeep:{value:C(0x2a8ac0)},cShallow:{value:C(0x4fb6e4)},sunDir:{value:SUNDIR},sunCol:{value:C(0xffffff)},amb:{value:.62},sunI:{value:.55}};
const seaMat=new THREE.ShaderMaterial({uniforms:seaUni,vertexShader:`
uniform float t;varying float vh;varying vec3 vn;varying vec2 vw;
float wave(vec2 p){return sin(p.x*.45+t*1.1)*.16+cos(p.y*.38+t*1.4)*.16+sin((p.x+p.y)*.2+t*.7)*.2+sin(p.x*1.3-p.y*.7-t*2.)*.04;}
void main(){vec4 wp=modelMatrix*vec4(position,1.);vec2 w=wp.xz;float h=wave(w);float e=.35;
 float hx=wave(w+vec2(e,0.));float hz=wave(w+vec2(0.,e));vn=normalize(vec3(h-hx,e,h-hz));vh=h;vw=w;
 gl_Position=projectionMatrix*viewMatrix*vec4(wp.x,h,wp.z,1.);}`,fragmentShader:`
uniform vec3 cDeep,cShallow,sunDir,sunCol;uniform float amb,sunI,t;varying float vh;varying vec3 vn;varying vec2 vw;
void main(){vec3 n=normalize(vn);float dif=max(dot(n,sunDir),0.);
 vec3 base=mix(cDeep,cShallow,clamp(vh*1.4+.5,0.,1.));vec3 col=base*(amb+dif*sunI*sunCol);
 vec3 hv=normalize(sunDir+normalize(vec3(1.,1.,1.)));float spec=pow(max(dot(n,hv),0.),80.)*.35*sunI;col+=sunCol*spec;
 float f=sin(vw.x*.9+vw.y*.5+t*.6+sin(vw.y*.8)*2.)*.5+.5;float foam=smoothstep(.93,1.,f)*smoothstep(.25,.5,vh);
 col=mix(col,vec3(.95,1.,1.),foam*.35);gl_FragColor=vec4(col,1.);}`});
const seaGeo=new THREE.PlaneGeometry(150,150,72,72);seaGeo.rotateX(-Math.PI/2);
const sea=new THREE.Mesh(seaGeo,seaMat);sea.frustumCulled=false;scene.add(sea);

// ============ textures
function skullTex(bg,fg,stitch){
  const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  g.fillStyle=bg;g.fillRect(0,0,256,256);
  if(stitch){g.strokeStyle='#d6c7a0';g.lineWidth=3;for(let y=40;y<256;y+=50){g.beginPath();g.moveTo(0,y);g.lineTo(256,y);g.stroke()}g.strokeStyle='#8a7a55';g.lineWidth=8;g.strokeRect(6,6,244,244)}
  g.fillStyle=fg;g.beginPath();g.arc(128,108,60,0,7);g.fill();g.fillRect(98,150,60,42);
  g.fillStyle=bg;g.beginPath();g.arc(104,106,14,0,7);g.arc(152,106,14,0,7);g.fill();
  g.beginPath();g.moveTo(128,122);g.lineTo(119,142);g.lineTo(137,142);g.fill();
  g.strokeStyle=fg;g.lineWidth=16;g.lineCap='round';g.beginPath();g.moveTo(60,200);g.lineTo(196,238);g.moveTo(196,200);g.lineTo(60,238);g.stroke();
  return new THREE.CanvasTexture(c);
}
function gradTex(){const c=document.createElement('canvas');c.width=64;c.height=256;const g=c.getContext('2d'),gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(255,255,255,.9)');g.fillStyle=gr;g.beginPath();g.moveTo(24,256);g.lineTo(40,256);g.lineTo(64,0);g.lineTo(0,0);g.fill();return new THREE.CanvasTexture(c)}

// ============ the pirate ship
const ship=new THREE.Group();scene.add(ship);
const wood=0x5b3a1e,rope=0x3a2a1a,dark=0x2a1a0c,iron=0x222428;
const outline=new THREE.Shape();[[-1.4,-3.5],[1.4,-3.5],[1.7,1],[0,4],[-1.7,1]].forEach(([x,y],i)=>i?outline.lineTo(x,y):outline.moveTo(x,y));outline.closePath();
function hullGeo(depth,scale){const g=new THREE.ExtrudeGeometry(outline,{depth,bevelEnabled:false});g.rotateX(-Math.PI/2);g.scale(scale,1,scale);return g}
{
  const B=new Baker();
  B.add(hullGeo(.5,.82),0x4a2a12,[0,-.4,0]);
  B.add(hullGeo(.1,1.0),0xb33a2a,[0,0,0]);
  B.add(hullGeo(.3,1.0),0x7a4b24,[0,.1,0]);B.add(hullGeo(.3,.995),0x6e4220,[0,.4,0]);B.add(hullGeo(.3,1.0),0x7a4b24,[0,.7,0]);
  B.add(hullGeo(.12,1.01),0xe6c34a,[0,.55,0]);
  B.add(hullGeo(.06,.9),0xc08a4e,[0,1.0,0]);
  for(let z=-3;z<3.5;z+=.5)B.add(Box(2.6,.012,.03),0x9a6a38,[0,1.065,z]); // deck planks seams
  B.add(Cyl(.1,.14,6.8),wood,[0,4.3,-.8]);B.add(Cyl(.06,.06,3.5,6),wood,[0,5.75,-.8],[Math.PI/2,0,0]);B.add(Cyl(.05,.05,3.3,6),wood,[0,2.3,-.8],[Math.PI/2,0,0]);
  B.add(Cyl(.07,.1,4.6),wood,[0,3.35,-2.4]);B.add(Cyl(.05,.05,2,6),wood,[0,4.4,-2.4],[Math.PI/2,0,0]);
  B.add(Cyl(.06,.09,2,6),wood,[0,1.5,-4.2],[Math.PI/2.6,0,0]);
  B.add(Cone(.22,.7),0xe6c34a,[0,.95,-4.05],[-Math.PI/2.3,0,0]);
  // rails
  const rp=[[-1.26,3.15],[-1.53,-.9],[0,-3.6],[1.53,-.9],[1.26,3.15]];
  for(let i=0;i<rp.length-1;i++){const [x1,z1]=rp[i],[x2,z2]=rp[i+1];
    B.rope(V(x1,1.45,z1),V(x2,1.45,z2),.04,wood);B.rope(V(x1,1.25,z1),V(x2,1.25,z2),.03,wood);
    const n=Math.max(2,Math.round(Math.hypot(x2-x1,z2-z1)/1.1));
    for(let k=0;k<=n;k++){const f=k/n;B.rope(V(x1+(x2-x1)*f,1.06,z1+(z2-z1)*f),V(x1+(x2-x1)*f,1.48,z1+(z2-z1)*f),.045,wood)}}
  B.rope(V(-1.26,1.45,3.15),V(1.26,1.45,3.15),.04,wood);
  // cannons
  for(const sd of [1,-1])for(const z of [2.3,1.2,.1]){const hx=1.4+.3*(3.5-z)/4.5;
    B.add(Box(.06,.34,.45),dark,[sd*(hx+.02),.7,z]);B.add(Cyl(.11,.14,.7),iron,[sd*(hx+.28),.7,z],[0,0,Math.PI/2]);B.add(Sph(.15),iron,[sd*(hx-.02),.7,z]);
    B.add(Cyl(.12,.14,.5),iron,[sd*(hx-.45),1.25,z],[0,0,Math.PI/2]);B.add(Box(.5,.2,.4),wood,[sd*(hx-.45),1.12,z]);}
  // stern cabin
  B.add(Box(2.1,.95,1.25),0x8a5a2b,[0,1.53,2.5]);B.add(Box(2.4,.14,1.55),0x9b2d2d,[0,2.08,2.5]);B.add(Box(2.2,.06,1.35),0x7a4b24,[0,1.04,2.5]);
  B.add(Box(.08,.6,.08),wood,[0,1.35,1.55]);
  for(const sd of [1,-1])B.rope(V(sd*1.0,1.06,1.78),V(sd*1.0,1.2,1.78),.03,dark);
  // crow's nest
  B.add(new THREE.CylinderGeometry(.5,.38,.4,8,1,true),wood,[0,5.55,-.8]);B.add(Cyl(.4,.4,.06),wood,[0,5.38,-.8]);
  // rigging
  for(const sd of [1,-1]){B.rope(V(0,5.4,-.8),V(sd*1.45,1.45,-.2),.02,rope);B.rope(V(0,5.4,-.8),V(sd*1.5,1.45,-1.2),.02,rope);B.rope(V(0,5.4,-.8),V(sd*1.35,1.45,1.0),.02,rope);B.rope(V(0,4.5,-2.4),V(sd*1.0,1.45,-2.0),.02,rope);
    for(const f of [.25,.4,.55,.7]){const a=V(0,5.4,-.8).lerp(V(sd*1.45,1.45,-.2),f),b=V(0,5.4,-.8).lerp(V(sd*1.5,1.45,-1.2),f);B.rope(a,b,.015,rope)}}
  B.rope(V(0,5.4,-.8),V(0,1.9,-4.6),.02,rope);B.rope(V(0,4.5,-2.4),V(0,1.7,-4.4),.02,rope);B.rope(V(0,5.4,-.8),V(0,2.2,3.0),.02,rope);
  // anchor, barrels, crates, rudder
  B.add(Box(.06,.6,.06),iron,[1.15,.85,-1.35],[0,0,.1]);B.add(Box(.4,.06,.06),iron,[1.15,1.05,-1.35],[0,0,.1]);B.add(new THREE.TorusGeometry(.2,.03,5,10,Math.PI),iron,[1.15,.57,-1.35],[0,0,Math.PI+.1]);
  for(const [x,z] of [[-.95,.4],[-.6,.9],[-1.0,-.4]]){B.add(Cyl(.24,.24,.5),0x8a5a2b,[x,1.31,z]);B.add(new THREE.TorusGeometry(.245,.02,4,10),iron,[x,1.4,z],[Math.PI/2,0,0]);B.add(new THREE.TorusGeometry(.245,.02,4,10),iron,[x,1.22,z],[Math.PI/2,0,0])}
  B.add(Box(.5,.5,.5),0xb8803f,[-.8,1.31,1.45],[0,.4,0]);B.add(Box(.4,.4,.4),0xa06a30,[-.5,1.27,-1.6],[0,-.3,0]);
  B.add(Box(.1,.9,.5),dark,[0,.1,3.7]);
  // treasure chest on deck
  B.add(Box(.5,.3,.35),0x6b3a16,[.9,1.22,-2.6]);B.add(Cyl(.18,.18,.5,8,1,false,0,Math.PI),0xe6c34a,[.9,1.37,-2.6],[0,0,Math.PI/2]);
  ship.add(B.build());
}
// dynamic ship parts
function billowSail(w,h,seg,amt){const g=new THREE.PlaneGeometry(w,h,seg,seg);g.userData.amt=amt;return g}
const sailGeo=billowSail(3.2,3.4,10,.4),fsailGeo=billowSail(1.9,1.9,6,.25),flagGeo=new THREE.PlaneGeometry(1.5,.9,8,2);
const sail=new THREE.Mesh(sailGeo,new THREE.MeshLambertMaterial({map:skullTex('#f3ead2','#1b1b1b',true),side:THREE.DoubleSide}));sail.rotation.y=Math.PI/2;sail.position.set(0,4.0,-.8);ship.add(sail);
const fsail=new THREE.Mesh(fsailGeo,new THREE.MeshLambertMaterial({color:0xf3ead2,side:THREE.DoubleSide}));fsail.rotation.y=Math.PI/2;fsail.position.set(0,3.4,-2.4);ship.add(fsail);
const flag=new THREE.Mesh(flagGeo,new THREE.MeshLambertMaterial({map:skullTex('#111','#fff',false),side:THREE.DoubleSide}));flag.rotation.y=Math.PI/2;flag.position.set(0,6.9,-1.5);ship.add(flag);
function animSail(mesh,t,phase){const g=mesh.geometry,q=g.attributes.position,amt=g.userData.amt,hw=g.parameters.width/2,hh=g.parameters.height/2;
  for(let i=0;i<q.count;i++){const x=q.getX(i),y=q.getY(i);q.setZ(i,amt*(1+.1*Math.sin(t*3+phase+x*2+y))*Math.cos(x/hw*Math.PI/2)*Math.cos(y/hh*Math.PI/2))}q.needsUpdate=true;g.computeVertexNormals()}
function animFlag(t){const q=flagGeo.attributes.position;for(let i=0;i<q.count;i++){const x=q.getX(i);q.setZ(i,.14*(x+.75)/1.5*Math.sin(x*4-t*9))}q.needsUpdate=true}
const wheel=new THREE.Group();wheel.position.set(0,1.62,1.55);ship.add(wheel);
{const B=new Baker();B.add(new THREE.TorusGeometry(.3,.04,5,12),0x8a5a2b);for(const a of [0,Math.PI/4,Math.PI/2,3*Math.PI/4])B.add(Box(.72,.04,.04),0x8a5a2b,[0,0,0],[0,0,a]);wheel.add(B.build())}
const glowMat=new THREE.MeshBasicMaterial({color:0xffd45a});
{const B=new Baker();for(const sd of [1,-1])for(const z of [2.2,2.8])B.add(Box(.04,.34,.34),0xffffff,[sd*1.06,1.6,z]);B.add(Box(1.2,.3,.04),0xffffff,[0,1.6,3.13]);
  for(const sd of [1,-1])B.add(Box(.16,.22,.16),0xffffff,[sd*1.0,1.3,1.78]);B.add(Box(.14,.2,.14),0xffffff,[0,5.9,-.8]);ship.add(B.build(glowMat))}
const wakeMat=new THREE.MeshBasicMaterial({map:gradTex(),transparent:true,opacity:.7,depthWrite:false});
const wake=new THREE.Mesh(new THREE.PlaneGeometry(2.2,7),wakeMat);wake.rotation.x=-Math.PI/2;wake.position.set(0,.25,6.8);ship.add(wake);
let bowT=0;

// ============ effects pools: splash rings, puffs, sparkles
const fx=[];
const ringGeo=new THREE.RingGeometry(.6,1,16);ringGeo.rotateX(-Math.PI/2);
function splash(x,z,size=1,life=.9){const m=new THREE.Mesh(ringGeo,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.9,depthWrite:false,side:THREE.DoubleSide}));
  m.position.set(x,.55,z);scene.add(m);fx.push({m,age:0,life,up:(a)=>{const u=a/life;m.scale.setScalar(size*(.3+2.2*u));m.material.opacity=.9*(1-u)}})}
const puffGeo=Sph(1,6,5);
function puff(p,color=0xdddddd,size=.4,life=1.6,vel=V(0,.6,0)){const m=new THREE.Mesh(puffGeo,new THREE.MeshLambertMaterial({color,transparent:true,opacity:.8,flatShading:true}));
  m.position.copy(p);scene.add(m);fx.push({m,age:0,life,up:(a,dt)=>{const u=a/life;m.position.addScaledVector(vel,dt);m.scale.setScalar(size*(.5+1.8*u));m.material.opacity=.8*(1-u)}})}
function sparkle(p){for(let i=0;i<10;i++){const m=new THREE.Mesh(Sph(.09,4,3),new THREE.MeshBasicMaterial({color:0xffe066}));m.position.copy(p);scene.add(m);
  const v=V(rnd(-2,2),rnd(2,5),rnd(-2,2));fx.push({m,age:0,life:1.1,up:(a,dt)=>{v.y-=9*dt;m.position.addScaledVector(v,dt);m.scale.setScalar(1-a/1.1)}})}}
function updateFx(dt){for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.age+=dt;if(f.age>=f.life){scene.remove(f.m);f.m.material.dispose();fx.splice(i,1)}else f.up(f.age,dt)}}

// ============ islands
const islands=[];let lighthouse=null;
function palmAt(B,x,z,s=1,h=2.4){B.add(Cyl(.12*s,.2*s,h,6),0x6b4a2b,[x,h/2+.4,z],[0,0,.12]);
  for(let k=0;k<6;k++)B.add(Cone(.28*s,1.8*s,4),k%2?0x2f7a3a:0x3b9448,[x+Math.cos(k)*.5*s+.28,h+.45,z+Math.sin(k)*.5*s],[Math.sin(k)*1.2,0,-Math.cos(k)*1.2]);
  B.add(Sph(.14,5,4),0x8a5a2b,[x+.3,h+.2,z+.2]);B.add(Sph(.14,5,4),0x8a5a2b,[x,h+.15,z-.25]);}
function makeIsland(kind){
  const g=new THREE.Group(),B=new Baker(),s=rnd(.8,1.7);let r=3.7*s+.6;

  // buoyancy
  const th=-h,c=Math.cos(th),s=Math.sin(th);const wp=(lx,lz)=>waveY(pos.x+lx*c+lz*s,pos.z-lx*s+lz*c,t);
  const hb=wp(0,-3.5),hs=wp(0,3.5),hp=wp(-1.5,0),hst=wp(1.5,0);
  ship.position.set(pos.x,.15+(hb+hs+hp+hst)/4*.8,pos.z);ship.rotation.order='YXZ';
  ship.rotation.y=th;ship.rotation.x=Math.atan2(hb-hs,7)*.8;ship.rotation.z=Math.atan2(hst-hp,3)*.8-turnRate*.4;
  animSail(sail,t,0);animSail(fsail,t,2);animFlag(t);wheel.rotation.z+=turnRate*dt*4+Math.sin(t)*.01;
  wakeMat.opacity=(.45+Math.sin(t*5)*.08)*clamp(Math.abs(speed)/SPEED,.15,1.3);wake.scale.y=speed<0?-1:1;bowT-=dt;if(bowT<0&&ship.rotation.x<-.02&&speed>.8){bowT=.7;const bp=ship.localToWorld(V(0,.3,-3.9));splash(bp.x,bp.z,.6,.7)}
  sea.position.set(pos.x,0,pos.z);seaUni.t.value=t;
  // volcano smoke + lighthouse beam
  for(const g of islands){const vd=g.userData.volcano;if(vd&&t>vd.next){vd.next=t+.55;puff(g.localToWorld(vd.top.clone()),0x777777,.5,4.5,V(.4,1.2,.2))}if(g.userData.beam)g.userData.beam.rotation.y=t*.9}
  // cannon at rocks
  cannonCd-=dt;if(cannonCd<0){for(const g of islands){if(g.userData.kind!=='rock')continue;const dx=g.position.x-pos.x,dz=g.position.z-pos.z,d=Math.hypot(dx,dz);if(d>7&&d<13){const b=norm(Math.atan2(dx,-dz)-h);if(Math.abs(Math.abs(b)-Math.PI/2)<.5){fireCannon(b>0?1:-1,1,g.position,false);cannonCd=28;break}}}}
  updateClouds(pos,dt);updateGulls(pos,t,dt);updateActors(dt,t);updateChests(pos,dt,t);updateFx(dt);scheduler(t);updateDay(t);
  if(banT>0){banT-=dt;if(banT<=0)banEl.classList.remove('on')}
  updateAmmo(t);updateJokes(t);
  camPos.set(pos.x,0,pos.z).add(CAMOFF);cam.position.lerp(camPos,Math.min(1,dt*3));
  if(cam.position.distanceToSquared(camPos)>900)cam.position.copy(camPos);
  cam.lookAt(cam.position.x-CAMOFF.x,0,cam.position.z-CAMOFF.z);
  planClawd(t,dt);
  renderer.render(scene,cam);ship.updateMatrixWorld(true);cam.updateMatrixWorld(true);placeClawd();
  requestAnimationFrame(frame);
}
cam.position.copy(camPos.set(pos.x,0,pos.z).add(CAMOFF));

}catch(e){console.error(e);const el=document.getElementById('err');el.style.display='flex';el.textContent='Fehler: '+e.message}
